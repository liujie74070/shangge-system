version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shangge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shangge
      POSTGRES_PASSWORD: ShAngGe2026!
      POSTGRES_DB: shangge_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shangge']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
